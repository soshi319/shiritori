<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 115" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'BIZ UDPGothic', sans-serif" 
     font-weight="900" 
     font-style="italic" 
     filter="url(#shadow)">
    
    <text x="222" y="72" 
          text-anchor="middle" 
          font-size="72" 
          letter-spacing="4" 
          fill="url(#textGrad)">
      シリトリーグ
    </text>

    <path d="M 25 94 L 420 94 L 435 94" 
          stroke="url(#accentGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-dasharray="310 15" />
  </g>
</svg>
